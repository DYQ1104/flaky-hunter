[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-hunter"
version = "1.0.0"
description = "Detect, rank and locate flaky tests from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "flaky-hunter contributors" }]
keywords = ["testing", "flaky-tests", "pytest", "ci", "test-infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version < '3.11'"]
color = ["rich>=13.0"]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
fh = "flaky_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flaky_hunter = ["demo/fixture/tests/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
